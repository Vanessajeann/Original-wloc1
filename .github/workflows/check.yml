name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.mjs
      - run: node --test tests/*.test.mjs
      - run: git diff --exit-code -- dist worker/wloc-worker.js worker/dist/_worker.js
